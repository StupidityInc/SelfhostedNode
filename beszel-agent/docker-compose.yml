services:
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./beszel_agent_data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Host networking is required for host interface statistics. Keep the
      # listener local and use the outbound WebSocket connection to the hub.
      LISTEN: "127.0.0.1:45876"
      DISABLE_SSH: "true"
      KEY: "${BESZEL_AGENT_KEY:?BESZEL_AGENT_KEY is required}"
      TOKEN: "${BESZEL_AGENT_TOKEN:?BESZEL_AGENT_TOKEN is required}"
      HUB_URL: "${BESZEL_HUB_URL:?BESZEL_HUB_URL is required}"
      SYSTEM_NAME: "${BESZEL_SYSTEM_NAME:?BESZEL_SYSTEM_NAME is required}"
