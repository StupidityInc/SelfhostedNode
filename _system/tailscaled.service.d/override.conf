# Drop-in for the upstream tailscaled.service unit.
# After every Tailscale (re)start, refresh the Tailscale IP SSOT file
# /opt/homelab/env-file/tailscale.env so it tracks the live address.
#
# Drop-ins only need to ADD directives; ExecStart from the upstream unit
# remains in effect.
#
# The leading '-' on ExecStartPost= tells systemd: do not treat a non-zero
# exit from the writer as a failure of tailscaled.service itself. The
# writer can legitimately fail (Tailscale still settling, no CGNAT IPv4
# yet, disk pressure, …) — when it does we do NOT want tailscaled to be
# marked failed and rolled back. A failing writer is reported in
# `systemctl status tailscaled` and surfaced by check-node.sh; it must
# never block Tailscale from coming up.

[Unit]
# Make sure ExecStartPost can locate the writer (it lives under
# /opt/stacks/_system/, owned by root, mode 0755).

[Service]
ExecStartPost=-/opt/stacks/_system/update-tailscale-ip.sh