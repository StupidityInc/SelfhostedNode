# Drop-in for the upstream tailscaled.service unit.
# After every Tailscale (re)start, refresh the Tailscale IP SSOT file
# /opt/homelab/env-file/tailscale.env so it tracks the live address.
#
# Drop-ins only need to ADD directives; ExecStart from the upstream unit
# remains in effect.

[Unit]
# Make sure ExecStartPost can locate the writer (it lives under
# /opt/stacks/_system/, owned by root, mode 0755).

[Service]
ExecStartPost=/opt/stacks/_system/update-tailscale-ip.sh